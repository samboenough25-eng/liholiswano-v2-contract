<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liholiswano (Testnet)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#dfe3e8;--acc:#0b6b4f;--warn:#a15c00;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#181c23;--ink:#eef1f5;--mute:#9aa4b2;--line:#2a303a;--acc:#4cc38a;--warn:#e0a44a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.banner{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 8px}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.k{word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px}
.stat b{display:block;font-size:1.05rem}.stat span{color:var(--mute);font-size:.8rem}
#log{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;max-height:240px;overflow:auto}
.err{color:var(--err)}.ok{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Liholiswano</h1>
<p class="sub">Rotating savings group on Stellar Testnet</p>
<div class="banner">Testnet only. Test money, no real value. Never paste a real wallet secret key here.</div>

<section>
  <h2>1. Your account</h2>
  <div class="row">
    <button id="gen">Create new account</button>
    <button id="fund" class="alt">Get free test XLM</button>
  </div>
  <label for="sec">Or paste an existing Testnet secret key (starts with S)</label>
  <input id="sec" type="password" autocomplete="off" placeholder="S...">
  <div class="row"><button id="imp" class="alt">Use this key</button></div>
  <p>Public address: <span id="pub" class="k">not set</span></p>
  <p id="secnote" class="k" hidden></p>
</section>

<section>
  <h2>2. Token trustline (once per token)</h2>
  <label for="acode">Asset code</label><input id="acode" placeholder="LIHO">
  <label for="aiss">Issuer address</label><input id="aiss" placeholder="G...">
  <div class="row"><button id="trust" class="alt">Add trustline</button></div>
</section>

<section>
  <h2>3. Your group</h2>
  <label for="cid">Contract ID</label>
  <input id="cid" value="CCMJ3S5KULUVEQLUVQE3M3JAEQFA7KJ3TTHSOW4GOMWRDGMXL2F62BLM">
  <label for="gid">Group ID</label><input id="gid" placeholder="e.g. t36044013610">
  <div class="row"><button id="load">Load group</button></div>
  <div id="state" class="grid"></div>
</section>

<section>
  <h2>4. Actions</h2>
  <div class="row">
    <button data-act="join_group">Join group</button>
    <button data-act="contribute">Contribute</button>
    <button data-act="settle_round" class="alt">Settle round</button>
    <button data-act="claim_refund">Claim refund</button>
  </div>
  <label for="bid">Bid (basis points of the pot, 0 = no discount)</label>
  <input id="bid" type="number" min="0" value="0">
  <div class="row"><button data-act="submit_bid">Submit bid</button></div>
</section>

<section><h2>Activity</h2><div id="log">Ready.</div></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk@12.3.0/dist/stellar-sdk.min.js"></script>
<script>
const S = window.StellarSdk;
const RPC_URL = 'https://soroban-testnet.stellar.org';
const HORIZON_URL = 'https://horizon-testnet.stellar.org';
const PASS = S.Networks.TESTNET;
const rpc = new S.SorobanRpc.Server(RPC_URL);
const horizon = new S.Horizon.Server(HORIZON_URL);
let kp = null; // held in memory only; never saved

const $ = id => document.getElementById(id);
const log = (m, cls) => { const d = $('log'); d.innerHTML += '\n<span class="' + (cls || '') + '">' + String(m).replace(/</g, '&lt;') + '</span>'; d.scrollTop = d.scrollHeight; };
const need = () => { if (!kp) throw new Error('Create or import an account first.'); };
const busy = async (fn) => {
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { log(friendly(e), 'err'); }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
};
const ERRS = {19:'Not eligible to bid this round.', 26:'Already initialized.'};
function friendly(e) {
  const m = (e && e.message) || String(e);
  const c = m.match(/Error\(Contract, #(\d+)\)/);
  return c ? 'Contract rejected the action (code ' + c[1] + '). ' + (ERRS[c[1]] || '') : m;
}
const fmt = v => (Number(v) / 1e7).toFixed(2);
const jsonSafe = o => JSON.parse(JSON.stringify(o, (k, v) => typeof v === 'bigint' ? v.toString() : v));

function setKey(k) {
  kp = k; $('pub').textContent = k.publicKey();
}

// ---- contract calls ----
function argsFor(name, gid, bid) {
  const id = S.nativeToScVal(gid, {type: 'symbol'});
  const me = new S.Address(kp.publicKey()).toScVal();
  switch (name) {
    case 'settle_round': case 'get_group_state': return [id];
    case 'submit_bid': return [id, me, S.nativeToScVal(Number(bid), {type: 'u32'})];
    default: return [id, me]; // join_group, contribute, claim_refund, get_member
  }
}
async function buildTx(name, args) {
  const acct = await rpc.getAccount(kp.publicKey());
  return new S.TransactionBuilder(acct, {fee: S.BASE_FEE, networkPassphrase: PASS})
    .addOperation(new S.Contract($('cid').value.trim()).call(name, ...args))
    .setTimeout(90).build();
}
async function read(name, args) {
  const sim = await rpc.simulateTransaction(await buildTx(name, args));
  if (!S.SorobanRpc.Api.isSimulationSuccess(sim)) throw new Error(sim.error || 'Read failed');
  return S.scValToNative(sim.result.retval);
}
async function write(name, args) {
  const prepared = await rpc.prepareTransaction(await buildTx(name, args));
  prepared.sign(kp);
  const sent = await rpc.sendTransaction(prepared);
  if (sent.status === 'ERROR') throw new Error('Rejected before sending: ' + JSON.stringify(jsonSafe(sent.errorResult || sent)));
  let r;
  for (let i = 0; i < 30; i++) {
    r = await rpc.getTransaction(sent.hash);
    if (r.status !== 'NOT_FOUND') break;
    await new Promise(res => setTimeout(res, 1500));
  }
  if (!r || r.status !== 'SUCCESS') throw new Error('Transaction did not succeed (' + (r ? r.status : 'timeout') + ')');
  return sent.hash;
}

// ---- buttons ----
$('gen').onclick = () => busy(async () => {
  setKey(S.Keypair.random());
  $('secnote').hidden = false;
  $('secnote').textContent = 'Secret key (write it down now, it will not be shown again): ' + kp.secret();
  log('New account created. Now tap "Get free test XLM".', 'ok');
});
$('imp').onclick = () => busy(async () => {
  setKey(S.Keypair.fromSecret($('sec').value.trim())); $('sec').value = '';
  log('Account loaded.', 'ok');
});
$('fund').onclick = () => busy(async () => {
  need();
  const r = await fetch('https://friendbot.stellar.org?addr=' + encodeURIComponent(kp.publicKey()));
  log(r.ok ? 'Account funded with test XLM.' : 'Friendbot said no (account may already be funded).', r.ok ? 'ok' : 'err');
});
$('trust').onclick = () => busy(async () => {
  need();
  const asset = new S.Asset($('acode').value.trim(), $('aiss').value.trim());
  const acct = await horizon.loadAccount(kp.publicKey());
  const tx = new S.TransactionBuilder(acct, {fee: S.BASE_FEE, networkPassphrase: PASS})
    .addOperation(S.Operation.changeTrust({asset})).setTimeout(60).build();
  tx.sign(kp);
  await horizon.submitTransaction(tx);
  log('Trustline added for ' + asset.code + '.', 'ok');
});
$('load').onclick = () => busy(async () => {
  need();
  const gid = $('gid').value.trim();
  const g = jsonSafe(await read('get_group_state', argsFor('get_group_state', gid)));
  let me = null;
  try { me = jsonSafe(await read('get_member', argsFor('get_member', gid))); } catch (e) { /* not a member yet */ }
  const st = (label, val) => '<div class="stat"><b>' + val + '</b><span>' + label + '</span></div>';
  $('state').innerHTML =
    st('Round', g.round) + st('Members', g.members.length + ' / ' + g.slots) +
    st('Locked', g.locked ? 'yes' : 'no') + st('Finished', g.completed ? 'yes (refunds open)' : 'no') +
    st('Pot contribution', fmt(g.config.contribution)) + st('Reserve', fmt(g.reserve)) +
    (me ? st('You: won', me.won_this_rotation ? 'yes' : 'not yet') + st('You: contributed', fmt(me.total_contributed)) +
          st('You: received', fmt(me.total_received)) + st('You: refunded', me.refunded ? 'yes' : 'no')
        : st('You', 'not a member'));
  log('Loaded group ' + gid + '.', 'ok');
});
document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => busy(async () => {
  need();
  const name = b.dataset.act, gid = $('gid').value.trim();
  if (!gid) throw new Error('Enter a group ID first.');
  log('Sending ' + name + '...');
  const hash = await write(name, argsFor(name, gid, $('bid').value));
  log(name + ' done. https://stellar.expert/explorer/testnet/tx/' + hash, 'ok');
}));
</script>
</body>
</html>
