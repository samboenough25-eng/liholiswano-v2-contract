<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Liholiswano Compliance</title><style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#14201b}header{background:#063d2d;color:white;padding:20px}main{max-width:1050px;margin:auto;padding:20px}.box{background:white;border:1px solid #dbe4df;border-radius:14px;padding:18px}button{background:#087f5b;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow:auto}.muted{color:#66736d}</style></head><body><header><main style="padding:0"><b>Liholiswano Compliance Portal</b><p style="margin:6px 0;color:#c9ddd6">KYC and compliance access only</p><button onclick="logout()">Sign out</button></main></header><main><div class="box"><h2>KYC Queue</h2><button onclick="load()">Refresh</button><pre id="out">Loading...</pre></div></main><script>const API=window.LIHOLISWANO_API_URL||'/api',token=localStorage.getItem('liholiswano_token');if(!token)location.href='platform.html';async function api(p,o={}){o.headers={Authorization:'Bearer '+token,'Content-Type':'application/json',...(o.headers||{})};let r=await fetch(API+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{out.textContent=JSON.stringify(await api('/admin/kyc'),null,2)}catch(e){out.textContent=e.message}}async function me(){try{let u=await api('/me');if(u.role!=='compliance')location.href=['owner','admin'].includes(u.role)?'owner.html':'customer.html';else load()}catch{logout()}}function logout(){localStorage.removeItem('liholiswano_token');location.href='platform.html'}me();</script></body></html>
