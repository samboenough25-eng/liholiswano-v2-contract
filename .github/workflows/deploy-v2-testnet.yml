name: Build and deploy v2 to Stellar Testnet

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET != '' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install system libraries the Stellar CLI needs
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install the Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown
        # Rust 1.79.0 is pinned because the current Soroban SDK 20.x dependency
        # stack uses ethnum 1.5.0, which does not compile with newer Rust versions.
        # The contract tests pass successfully with Rust 1.79.0.

      - name: Confirm the v2 contract's tests still pass
        working-directory: contract-v2
        run: cargo test

      - name: Build the v2 contract to wasm
        working-directory: contract-v2
        run: stellar contract build

      - name: Set up the admin identity
        run: |
          if [ -n "${{ secrets.STELLAR_ADMIN_SECRET }}" ]; then
            echo "Reusing the saved admin identity"
            echo "${{ secrets.STELLAR_ADMIN_SECRET }}" | stellar keys add admin
          else
            echo "No saved admin identity yet — generating and funding a new one on Testnet"
            stellar keys generate admin --network testnet --fund
          fi

      # SECURITY: the old version of this step printed the raw secret key
      # with `stellar keys secret admin`, straight into the Actions run
      # log. On a public repo that log is world-readable, so anyone could
      # copy the key and drain (or otherwise abuse) whatever the admin
      # account controls. This step instead writes the secret directly
      # into the repo's encrypted secret store via the GitHub CLI — it
      # never appears in any log output, anywhere.
      #
      # This does require ONE secret to already exist before the first
      # run: a fine-grained PAT (or GitHub App token) with this repo's
      # "Secrets: write" permission, saved as GH_PAT_FOR_SECRETS. That's
      # an unavoidable bootstrap step — GitHub deliberately does not let
      # a workflow's own default token create or overwrite repo secrets,
      # precisely to stop a compromised workflow from planting or
      # rotating secrets on its own. Create that PAT once, by hand, in
      # your GitHub account settings, scoped only to this repo.
      - name: Save the new admin identity as a repo secret (first run only — no key ever printed)
        if: ${{ env.HAS_ADMIN_SECRET == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: |
          echo "Admin public key (safe to share):"
          stellar keys public-key admin
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT_FOR_SECRETS is not set. See this step's comment for the one-time bootstrap PAT you need to create before the admin secret can be saved automatically."
            exit 1
          fi
          stellar keys secret admin | gh secret set STELLAR_ADMIN_SECRET --repo "${{ github.repository }}"
          echo "Admin secret key saved directly to the STELLAR_ADMIN_SECRET repo secret. It was never printed to this log."

      - name: Deploy the Liholiswano v2 contract
        working-directory: contract-v2
        run: |
          WASM_PATH=$(find target -name "liholiswano_contract_v2.wasm" | head -n1)
          echo "Using wasm at: $WASM_PATH"
          CONTRACT_ID=$(stellar contract deploy --wasm "$WASM_PATH" --network testnet --source-account admin)
          echo "Liholiswano v2 contract ID: $CONTRACT_ID"
