name: Build and deploy v2 to Stellar Testnet

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HAS_ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET != '' }}

      # Circle's Testnet USDC issuer.
      # This is the same value used by approve-stablecoins.sh.
      USDC_TESTNET_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5

    steps:

      # ============================================================
      # 1. CHECK OUT THE REPOSITORY
      # ============================================================

      - name: Check out the repo
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL SYSTEM LIBRARIES
      #
      # expect is included because Stellar CLI asks interactively
      # for a secret key when using:
      #
      # stellar keys add admin --secret-key
      #
      # GitHub Actions has no human available to type that secret,
      # so expect will answer the prompt without printing the secret.
      # ============================================================

      - name: Install system libraries
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev \
            expect


      # ============================================================
      # 3. INSTALL STELLAR CLI
      #
      # We no longer compile Stellar CLI with:
      #
      # cargo install --locked stellar-cli --version 21.5.3
      #
      # That was the source of the ethnum compilation failure.
      #
      # Stellar officially provides this GitHub Action.
      # ============================================================

      - name: Install the Stellar CLI
        uses: stellar/stellar-cli@v23.0.1


      # ============================================================
      # 4. CONFIRM STELLAR CLI
      # ============================================================

      - name: Confirm Stellar CLI installation
        run: |
          stellar --version


      # ============================================================
      # 5. INSTALL RUST 1.79.0
      #
      # This remains pinned because the current Liholiswano
      # contract uses the Soroban SDK 20.x dependency stack.
      # ============================================================

      - name: Install Rust 1.79.0 with the wasm target
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown


      # ============================================================
      # 6. CONFIRM RUST VERSION
      # ============================================================

      - name: Confirm Rust version
        run: |
          rustc --version
          cargo --version


      # ============================================================
      # 7. RUN ALL CONTRACT TESTS
      #
      # Deployment will STOP here if any test fails.
      # ============================================================

      - name: Confirm the tests still pass
        working-directory: contract-v2
        run: |
          cargo test --locked


      # ============================================================
      # 8. BUILD THE CONTRACT
      # ============================================================

      - name: Build the contract to wasm
        working-directory: contract-v2
        run: |
          stellar contract build


      # ============================================================
      # 9. CONFIRM WASM EXISTS
      # ============================================================

      - name: Confirm WASM build output
        working-directory: contract-v2
        run: |
          WASM_PATH="target/wasm32-unknown-unknown/release/liholiswano_contract_v2.wasm"

          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::Expected WASM file was not found:"
            echo "$WASM_PATH"
            exit 1
          fi

          echo "WASM file found:"
          ls -lh "$WASM_PATH"


      # ============================================================
      # 10. SET UP THE ADMIN IDENTITY
      #
      # EXISTING ADMIN:
      #
      # STELLAR_ADMIN_SECRET is imported into the temporary GitHub
      # runner as an environment variable.
      #
      # Stellar CLI asks:
      #
      # Type a secret key or 12/24 word seed phrase:
      #
      # We use expect to answer that prompt.
      #
      # IMPORTANT:
      # The secret is never echoed into the Actions log.
      #
      #
      # FIRST RUN:
      #
      # If STELLAR_ADMIN_SECRET does not exist, create a new
      # Testnet identity and fund it.
      # ============================================================

      - name: Set up the admin identity
        env:
          ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET }}

        run: |

          if [ -n "$ADMIN_SECRET" ]; then

            echo "Reusing the saved admin identity"

            # Disable shell tracing so the secret cannot accidentally
            # appear in the Actions log.
            set +x

            # Export the secret for the expect script.
            export ADMIN_SECRET

            # Use expect because Stellar CLI's --secret-key option
            # reads the secret interactively.
            #
            # log_user 0 prevents the interaction from being printed.
            expect <<'EXPECT_SCRIPT'

            log_user 0

            set secret $env(ADMIN_SECRET)

            spawn stellar keys add admin --secret-key --overwrite

            expect {
                -re "(?i).*secret.*key.*" {
                    send -- "$secret\r"
                }

                -re "(?i).*seed.*phrase.*" {
                    send -- "$secret\r"
                }

                timeout {
                    exit 1
                }

                eof {
                    exit 1
                }
            }

            expect {
                eof {
                    exit [lindex [wait] 3]
                }

                timeout {
                    exit 1
                }
            }

            EXPECT_SCRIPT

            # Remove the secret from the shell environment as soon
            # as the identity has been imported.
            unset ADMIN_SECRET

          else

            echo "No saved admin identity yet."
            echo "Generating and funding a new Testnet admin identity."

            stellar keys generate admin \
              --network testnet \
              --fund

          fi

          echo "Admin public key (safe to share):"

          stellar keys address admin


      # ============================================================
      # 11. SAVE NEW ADMIN SECRET
      #
      # FIRST RUN ONLY.
      #
      # This sends the secret directly to GitHub's encrypted
      # repository secret storage.
      #
      # The secret itself is NOT printed.
      # ============================================================

      - name: Save the new admin identity as a repo secret (first run only)
        if: ${{ env.HAS_ADMIN_SECRET == 'false' }}

        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}

        run: |

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT_FOR_SECRETS is not set."
            echo "::error::Create the required GitHub token and save it as GH_PAT_FOR_SECRETS."
            exit 1
          fi

          stellar keys secret admin | \
            gh secret set STELLAR_ADMIN_SECRET \
            --repo "${{ github.repository }}"

          echo "Admin secret saved to STELLAR_ADMIN_SECRET."
          echo "The secret itself was never printed."


      # ============================================================
      # 12. DEPLOY THE CONTRACT
      # ============================================================

      - name: Deploy the contract
        id: deploy
        working-directory: contract-v2

        run: |

          WASM_PATH="target/wasm32-unknown-unknown/release/liholiswano_contract_v2.wasm"

          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::WASM not found:"
            echo "$WASM_PATH"
            exit 1
          fi

          echo "Using WASM:"
          echo "$WASM_PATH"

          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_PATH" \
            --network testnet \
            --source-account admin)

          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

          echo "Liholiswano v2 contract ID:"
          echo "$CONTRACT_ID"


      # ============================================================
      # 13. INITIALIZE THE CONTRACT
      #
      # initialize is first-caller-wins.
      #
      # The admin public key becomes the protocol admin.
      # ============================================================

      - name: Initialize the contract (sets the protocol admin)
        run: |

          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin \
            --network testnet \
            -- initialize \
            --protocol_admin "$(stellar keys address admin)"


      # ============================================================
      # 14. MAKE SURE TESTNET USDC SAC EXISTS
      #     AND APPROVE IT IN LIHOLISWANO
      # ============================================================

      - name: Make sure Testnet USDC has a token contract, then approve it
        run: |

          echo "Checking/deploying Testnet USDC Stellar Asset Contract..."

          # Deploy the Stellar Asset Contract for USDC if necessary.
          #
          # If it already exists, continue.
          stellar contract asset deploy \
            --asset "USDC:${USDC_TESTNET_ISSUER}" \
            --source-account admin \
            --network testnet \
            || echo "USDC SAC already deployed - continuing"


          # Get the USDC SAC contract ID.
          USDC_SAC=$(stellar contract id asset \
            --asset "USDC:${USDC_TESTNET_ISSUER}" \
            --network testnet)


          echo "USDC-testnet token contract:"
          echo "$USDC_SAC"


          # Approve USDC inside Liholiswano.
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin \
            --network testnet \
            -- add_approved_token \
            --protocol_admin "$(stellar keys address admin)" \
            --token "$USDC_SAC"


          echo "Approved tokens now:"


          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin \
            --network testnet \
            -- list_approved_tokens


      # ============================================================
      # 15. GITHUB ACTIONS SUMMARY
      # ============================================================

      - name: Summary
        run: |

          {
            echo "### Liholiswano v2 deployed to Stellar Testnet"
            echo ""
            echo "Contract ID: \`${{ steps.deploy.outputs.contract_id }}\`"
            echo ""
            echo "Save this as the repo secret STELLAR_CONTRACT_ID if required by auto-settle.yml."
            echo ""
            echo "Testnet is periodically reset by SDF."
            echo "If this contract ID stops working after a Testnet reset, redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
