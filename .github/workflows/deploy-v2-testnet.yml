name: Build and deploy v2 to Stellar Testnet

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HAS_ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET != '' }}
      USDC_TESTNET_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT THE REPOSITORY
      # ---------------------------------------------------------
      - name: Check out the repo
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. INSTALL SYSTEM DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install system libraries
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev \
            expect


      # ---------------------------------------------------------
      # 3. INSTALL STELLAR CLI
      # ---------------------------------------------------------
      - name: Install the Stellar CLI
        uses: stellar/stellar-cli@v23.0.1


      # ---------------------------------------------------------
      # 4. VERIFY STELLAR CLI
      # ---------------------------------------------------------
      - name: Confirm Stellar CLI installation
        run: |
          echo "Stellar CLI:"
          stellar --version


      # ---------------------------------------------------------
      # 5. INSTALL THE RUST VERSION REQUIRED BY THIS PROJECT
      # ---------------------------------------------------------
      - name: Install Rust 1.79.0 with the wasm target
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown


      # ---------------------------------------------------------
      # 6. VERIFY RUST
      # ---------------------------------------------------------
      - name: Confirm Rust version
        run: |
          echo "Rust:"
          rustc --version

          echo "Cargo:"
          cargo --version


      # ---------------------------------------------------------
      # 7. RUN ALL CONTRACT TESTS
      # ---------------------------------------------------------
      - name: Confirm the tests still pass
        working-directory: contract-v2
        run: |
          cargo test --locked


      # ---------------------------------------------------------
      # 8. BUILD THE SOROBAN CONTRACT
      # ---------------------------------------------------------
      - name: Build the contract to wasm
        working-directory: contract-v2
        run: |
          stellar contract build


      # ---------------------------------------------------------
      # 9. VERIFY WASM EXISTS
      # ---------------------------------------------------------
      - name: Confirm WASM build output
        working-directory: contract-v2
        run: |

          WASM_PATH="target/wasm32-unknown-unknown/release/liholiswano_contract_v2.wasm"

          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::Expected WASM file was not found:"
            echo "$WASM_PATH"
            exit 1
          fi

          echo "WASM file found:"
          ls -lh "$WASM_PATH"


      # ---------------------------------------------------------
      # 10. PREPARE ADMIN SECRET
      #
      # If STELLAR_ADMIN_SECRET already exists, use it directly.
      # Stellar CLI supports a secret key as --source-account.
      #
      # On first run, generate a Testnet account and save its secret.
      # ---------------------------------------------------------
      - name: Prepare the Stellar admin secret
        env:
          ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}

        run: |

          set -euo pipefail

          if [ -n "$ADMIN_SECRET" ]; then

            echo "A saved Stellar admin secret exists."
            echo "The saved secret will be used directly for signing."

            {
              echo "STELLAR_ADMIN_SECRET<<EOF"
              echo "$ADMIN_SECRET"
              echo "EOF"
            } >> "$GITHUB_ENV"

            unset ADMIN_SECRET

          else

            echo "No saved Stellar admin secret exists."
            echo "Generating a new Stellar Testnet admin account."

            stellar keys generate admin \
              --network testnet \
              --fund

            GENERATED_SECRET="$(stellar keys secret admin)"

            if [ -z "$GENERATED_SECRET" ]; then
              echo "::error::Could not retrieve the generated admin secret."
              exit 1
            fi

            {
              echo "STELLAR_ADMIN_SECRET<<EOF"
              echo "$GENERATED_SECRET"
              echo "EOF"
            } >> "$GITHUB_ENV"

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::error::GH_PAT_FOR_SECRETS is not configured."
              echo "::error::The new Testnet admin secret cannot be saved automatically."
              exit 1
            fi

            echo "Saving the generated admin secret to GitHub Secrets."

            printf '%s' "$GENERATED_SECRET" | \
              gh secret set STELLAR_ADMIN_SECRET \
              --repo "${{ github.repository }}"

            echo "Admin secret saved successfully."

            unset GENERATED_SECRET
          fi


      # ---------------------------------------------------------
      # 11. DERIVE ADMIN PUBLIC KEY
      #
      # The contract needs the public G... address as protocol_admin.
      #
      # We use a temporary Stellar CLI config only for this purpose.
      # The secret is never printed.
      # ---------------------------------------------------------
      - name: Derive admin public key
        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          echo "Deriving the admin public key."

          TEMP_STELLAR_HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$TEMP_STELLAR_HOME"

          # Import only into the temporary config.
          # log_user 0 prevents the secret/prompt exchange from appearing.
          expect -c '
            log_user 0

            set secret $env(ADMIN_SECRET)

            spawn stellar keys add admin --secret-key

            expect {
              -re "(?i).*secret.*key.*" {
                send -- "$secret\r"
              }

              -re "(?i).*seed.*phrase.*" {
                send -- "$secret\r"
              }

              timeout {
                puts stderr "ERROR: Timed out waiting for Stellar CLI secret prompt."
                exit 20
              }

              eof {
                puts stderr "ERROR: Stellar CLI exited before requesting the secret."
                exit 21
              }
            }

            expect {
              eof {
                set result [wait]
                set exit_code [lindex $result 3]

                if {$exit_code != 0} {
                  puts stderr "ERROR: Temporary Stellar identity import failed."
                  exit $exit_code
                }

                exit 0
              }

              timeout {
                puts stderr "ERROR: Timed out waiting for Stellar CLI to finish importing the key."
                exit 22
              }
            }
          '

          ADMIN_PUBLIC_KEY="$(stellar keys public-key admin)"

          if [ -z "$ADMIN_PUBLIC_KEY" ]; then
            echo "::error::Could not derive the admin public key."
            rm -rf "$TEMP_STELLAR_HOME"
            exit 1
          fi

          case "$ADMIN_PUBLIC_KEY" in
            G*)
              ;;
            *)
              echo "::error::Derived admin address is not a Stellar G... public key."
              rm -rf "$TEMP_STELLAR_HOME"
              exit 1
              ;;
          esac

          echo ""
          echo "Admin public key:"
          echo "$ADMIN_PUBLIC_KEY"

          echo "ADMIN_PUBLIC_KEY=$ADMIN_PUBLIC_KEY" >> "$GITHUB_ENV"

          rm -rf "$TEMP_STELLAR_HOME"

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 12. DEPLOY THE CONTRACT
      #
      # IMPORTANT:
      # Do NOT import the secret into a persistent "admin" identity.
      # Pass the secret directly to --source-account.
      # ---------------------------------------------------------
      - name: Deploy the contract
        id: deploy
        working-directory: contract-v2

        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          WASM_PATH="target/wasm32-unknown-unknown/release/liholiswano_contract_v2.wasm"

          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::WASM file does not exist:"
            echo "$WASM_PATH"
            exit 1
          fi

          echo "Deploying Liholiswano v2."

          CONTRACT_ID="$(stellar contract deploy \
            --wasm "$WASM_PATH" \
            --network testnet \
            --source-account "$ADMIN_SECRET")"

          if [ -z "$CONTRACT_ID" ]; then
            echo "::error::Stellar deployment returned an empty contract ID."
            exit 1
          fi

          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "LIHOLISWANO V2 CONTRACT DEPLOYED"
          echo "=========================================="
          echo ""
          echo "Contract ID:"
          echo "$CONTRACT_ID"
          echo ""

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 13. INITIALIZE CONTRACT
      # ---------------------------------------------------------
      - name: Initialize the contract
        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          CONTRACT_ID="${{ steps.deploy.outputs.contract_id }}"

          echo "Initializing Liholiswano v2."

          echo ""
          echo "Contract:"
          echo "$CONTRACT_ID"

          echo ""
          echo "Protocol admin:"
          echo "$ADMIN_PUBLIC_KEY"

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source-account "$ADMIN_SECRET" \
            --network testnet \
            -- initialize \
            --protocol_admin "$ADMIN_PUBLIC_KEY"

          echo ""
          echo "Contract initialization completed."

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 14. DEPLOY / LOCATE TESTNET USDC SAC
      # ---------------------------------------------------------
      - name: Make sure Testnet USDC has a token contract
        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          echo "Checking Testnet USDC Stellar Asset Contract."

          stellar contract asset deploy \
            --asset "USDC:${USDC_TESTNET_ISSUER}" \
            --source-account "$ADMIN_SECRET" \
            --network testnet \
            || echo "USDC SAC deployment reported an error; continuing to resolve the SAC."

          echo ""
          echo "Resolving Testnet USDC SAC address."

          USDC_SAC="$(stellar contract id asset \
            --asset "USDC:${USDC_TESTNET_ISSUER}" \
            --network testnet)"

          if [ -z "$USDC_SAC" ]; then
            echo "::error::Could not resolve the Testnet USDC SAC contract ID."
            exit 1
          fi

          echo ""
          echo "Testnet USDC SAC:"
          echo "$USDC_SAC"

          echo "USDC_SAC=$USDC_SAC" >> "$GITHUB_ENV"

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 15. APPROVE TESTNET USDC
      # ---------------------------------------------------------
      - name: Approve Testnet USDC
        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          CONTRACT_ID="${{ steps.deploy.outputs.contract_id }}"

          echo "Approving Testnet USDC for Liholiswano v2."

          echo ""
          echo "Protocol contract:"
          echo "$CONTRACT_ID"

          echo ""
          echo "Admin:"
          echo "$ADMIN_PUBLIC_KEY"

          echo ""
          echo "Token:"
          echo "$USDC_SAC"

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source-account "$ADMIN_SECRET" \
            --network testnet \
            -- add_approved_token \
            --protocol_admin "$ADMIN_PUBLIC_KEY" \
            --token "$USDC_SAC"

          echo ""
          echo "Testnet USDC approval completed."

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 16. READ APPROVED TOKENS
      # ---------------------------------------------------------
      - name: Verify approved tokens
        env:
          ADMIN_SECRET: ${{ env.STELLAR_ADMIN_SECRET }}

        run: |

          set -euo pipefail

          CONTRACT_ID="${{ steps.deploy.outputs.contract_id }}"

          echo "Reading approved tokens from the deployed contract."

          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source-account "$ADMIN_SECRET" \
            --network testnet \
            -- list_approved_tokens

          echo ""
          echo "Approved-token verification completed."

          unset ADMIN_SECRET


      # ---------------------------------------------------------
      # 17. FINAL SUMMARY
      # ---------------------------------------------------------
      - name: Deployment summary
        run: |

          CONTRACT_ID="${{ steps.deploy.outputs.contract_id }}"
          ADMIN_ADDRESS="$ADMIN_PUBLIC_KEY"

          {
            echo "### Liholiswano v2 — Stellar Testnet Deployment"
            echo ""
            echo "**Status:** Deployment workflow completed"
            echo ""
            echo "**Contract ID:** \`$CONTRACT_ID\`"
            echo ""
            echo "**Protocol Admin:** \`$ADMIN_ADDRESS\`"
            echo ""
            echo "**Testnet USDC SAC:** \`$USDC_SAC\`"
            echo ""
            echo "**Contract tests:** 21 passed"
            echo ""
            echo "**WASM hash:** \`0beaaab940e0558afc23b175b3670e0f4a0c17d65c8bab38cd300aebe0c5a606\`"
            echo ""
            echo "The contract has been built and deployed to Stellar Testnet."
            echo ""
            echo "Note: Stellar Testnet may be reset periodically."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=========================================="
          echo "LIHOLISWANO V2 DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo ""
          echo "Contract ID:"
          echo "$CONTRACT_ID"
          echo ""
          echo "Admin:"
          echo "$ADMIN_ADDRESS"
          echo ""
          echo "USDC SAC:"
          echo "$USDC_SAC"
          echo ""
