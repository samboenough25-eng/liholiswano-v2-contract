name: Build and deploy v2 to Stellar Testnet

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET != '' }}
      # Circle's Testnet USDC issuer (same value as approve-stablecoins.sh).
      USDC_TESTNET_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install system libraries the Stellar CLI needs
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libusb-1.0-0-dev

      # Installed BEFORE the 1.79 pin on purpose: the CLI is built with the
      # runner's default (newer) Rust; only the contract needs the old one.
      # Run #2 spent 14m40s compiling the CLI. Cache the binary and pin the
      # exact version that was proven to work (keys add via stdin, deploy).
      - name: Cache the Stellar CLI binary
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-28.0.0

      - name: Install the Stellar CLI (skipped on cache hit)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version 28.0.0

      - name: Install Rust 1.79.0 with the wasm target (keep the pin - see contract-v2-test.yml)
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown

      - name: Confirm the tests still pass
        working-directory: contract-v2
        run: cargo test --locked

      - name: Build the contract to wasm
        working-directory: contract-v2
        run: stellar contract build

      - name: Set up the admin identity
        env:
          ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET }}
        run: |
          if [ -n "$ADMIN_SECRET" ]; then
            echo "Reusing the saved admin identity"
            printf '%s\n' "$ADMIN_SECRET" | stellar keys add admin
          else
            echo "No saved admin identity yet - generating and funding a new one on Testnet"
            stellar keys generate admin --network testnet --fund
          fi
          echo "Admin public key (safe to share): $(stellar keys address admin)"

      # First run only. The secret goes straight into the repo's encrypted
      # secret store and is never printed. Needs GH_PAT_FOR_SECRETS (see the
      # beginner guide, Part 7).
      - name: Save the new admin identity as a repo secret (first run only)
        if: ${{ env.HAS_ADMIN_SECRET == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT_FOR_SECRETS is not set. Create a fine-grained PAT scoped to this repo with Secrets: write and save it as GH_PAT_FOR_SECRETS first."
            exit 1
          fi
          stellar keys secret admin | gh secret set STELLAR_ADMIN_SECRET --repo "${{ github.repository }}"
          echo "Admin secret saved to STELLAR_ADMIN_SECRET. It was never printed."

      - name: Deploy the contract
        id: deploy
        working-directory: contract-v2
        run: |
          WASM_PATH=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name "liholiswano_contract_v2.wasm" | head -n1)
          if [ -z "$WASM_PATH" ]; then echo "::error::wasm not found in target/wasm32-unknown-unknown/release"; exit 1; fi
          echo "Using wasm at: $WASM_PATH"
          CONTRACT_ID=$(stellar contract deploy --wasm "$WASM_PATH" --network testnet --source-account admin)
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Liholiswano v2 contract ID: $CONTRACT_ID"

      # WITHOUT THIS STEP every create_group fails with NotInitialized.
      # It runs immediately after deploy so nobody else can claim the
      # protocol-admin role in the gap (initialize is first-caller-wins).
      - name: Initialize the contract (sets the protocol admin)
        run: |
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin --network testnet \
            -- initialize --protocol_admin "$(stellar keys address admin)"

      - name: Make sure Testnet USDC has a token contract, then approve it
        run: |
          # Deploys the Stellar Asset Contract for USDC if nobody has yet (harmless if it exists).
          stellar contract asset deploy --asset "USDC:${USDC_TESTNET_ISSUER}" \
            --source-account admin --network testnet || echo "USDC SAC already deployed - continuing"
          USDC_SAC=$(stellar contract id asset --asset "USDC:${USDC_TESTNET_ISSUER}" --network testnet)
          echo "USDC-testnet token contract: $USDC_SAC"
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin --network testnet \
            -- add_approved_token --protocol_admin "$(stellar keys address admin)" --token "$USDC_SAC"
          echo "Approved tokens now:"
          stellar contract invoke \
            --id "${{ steps.deploy.outputs.contract_id }}" \
            --source-account admin --network testnet \
            -- list_approved_tokens

      - name: Summary
        run: |
          {
            echo "### Liholiswano v2 deployed to Testnet"
            echo ""
            echo "Contract ID: \`${{ steps.deploy.outputs.contract_id }}\`"
            echo ""
            echo "Save this as the repo secret STELLAR_CONTRACT_ID (used by auto-settle.yml)."
            echo "Testnet is periodically reset by SDF - if this ID stops working, redeploy."
          } >> "$GITHUB_STEP_SUMMARY"
