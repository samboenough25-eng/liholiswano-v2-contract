name: Contract v2 tests

on:
  push:
    paths:
      - "contract-v2/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        # This used to pin 1.79.0 as a workaround for a dependency
        # resolution bug (base64ct/zeroize/derive_arbitrary). That's now
        # fixed by the committed Cargo.lock — verified by running
        # `cargo test` clean on stock Rust with no manual pinning — so
        # this workflow no longer needs to lag behind current Rust.

      - name: Run the v2 contract's unit tests
        working-directory: contract-v2
        run: cargo test
