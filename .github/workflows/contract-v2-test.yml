name: Contract v2 tests

on:
  push:
    paths:
      - "contract-v2/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@1.79.0
        # Rust 1.79.0 is pinned because the current Soroban SDK 20.x dependency
        # stack uses ethnum 1.5.0, which does not compile with newer Rust versions.
        # The contract tests pass successfully with Rust 1.79.0.

      - name: Run the v2 contract's unit tests
        working-directory: contract-v2
        run: cargo test
