name: Contract v2 tests

on:
  push:
    paths:
      - "contract-v2/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@1.79.0
        with:
          targets: wasm32-unknown-unknown
        # KEEP THIS PIN. Soroban SDK 20.x pulls ethnum 1.5.0, which does not
        # compile on current stable rustc (E0512 in error.rs) - this was seen
        # live on GitHub Actions. Old-SDK wasm output is also only known-good
        # on older Rust. Do not switch to @stable without a real Actions run
        # proving it works. (Local Rust 1.75 passing proves nothing about this.)

      - name: Run the contract's unit tests against the committed lockfile
        working-directory: contract-v2
        # --locked makes CI FAIL if Cargo.lock is missing or out of date,
        # instead of silently re-resolving to versions that break the build.
        run: cargo test --locked
