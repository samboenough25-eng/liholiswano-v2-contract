name: Testnet - initialize + live test cycle (existing contract)

# Continues from the deployed contract. Uses your saved STELLAR_ADMIN_SECRET
# (the deployer) as protocol admin + group admin, and throwaway accounts for
# everything else. This workflow is for the current deployed v2.2 contract.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Deployed Liholiswano contract ID"
        required: true
        default: "CAGSH4W3EYKOBHV6TUZ2WMKHKMZP6NNID5PLERFEV2EG6TRZWBZRKLY"

jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-live-cycle]')
    runs-on: ubuntu-latest
    env:
      CID: ${{ inputs.contract_id || 'CAGSH4W3EYKOBHV6TUZ2WMKHKMZP6NNID5PLERFEV2EG6TRZWBZRKLY' }}
      NET: testnet
    steps:
      - name: Install system libraries the Stellar CLI needs
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libusb-1.0-0-dev

      - name: Cache the Stellar CLI binary
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-27.0.0

      - name: Install the Stellar CLI (skipped on cache hit)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version 27.0.0

      - name: Load the admin identity (same secret the deploy used)
        env:
          ADMIN_SECRET: ${{ secrets.STELLAR_ADMIN_SECRET }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then echo "::error::STELLAR_ADMIN_SECRET is not set"; exit 1; fi
          printf '%s\n' "$ADMIN_SECRET" | stellar keys add admin
          echo "Admin: $(stellar keys address admin)"

      - name: Initialize the contract (first caller becomes protocol admin)
        run: |
          ADMIN=$(stellar keys address admin)
          if stellar contract invoke --id "$CID" --source-account admin --network $NET \
               -- initialize --protocol_admin "$ADMIN"; then
            echo "Initialized."
          else
            echo "::warning::initialize failed - fine if it was already initialized by this admin; otherwise later steps will fail."
          fi

      - name: Create throwaway accounts and a test token (LIHO)
        run: |
          set -euo pipefail
          for n in issuer m1 m2 m3; do stellar keys generate $n --network $NET --fund; done
          ASSET="LIHO:$(stellar keys address issuer)"
          stellar contract asset deploy --asset "$ASSET" --source-account issuer --network $NET
          TOKEN=$(stellar contract id asset --asset "$ASSET" --network $NET)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          for m in m1 m2 m3; do
            stellar tx new change-trust --source-account $m --line "$ASSET" --network $NET
            stellar tx new payment --source-account issuer \
              --destination "$(stellar keys address $m)" --asset "$ASSET" \
              --amount 100000000 --network $NET
          done
          echo "Test token contract: $TOKEN"

      - name: Verify deployed contract and approve the test token
        run: |
          set -euo pipefail
          ADMIN="$(stellar keys address admin)"
          echo "Contract: $CID"
          echo "Protocol admin: $ADMIN"
          echo "Test token: $TOKEN"
          echo "Current approved tokens:"
          stellar contract invoke --id "$CID" --source-account admin --network $NET -- list_approved_tokens
          echo "Adding test token to allowlist..."
          stellar contract invoke --id "$CID" --source-account admin --network $NET \
            -- add_approved_token --protocol_admin "$ADMIN" --token "$TOKEN"
          echo "Approved tokens after update:"
          stellar contract invoke --id "$CID" --source-account admin --network $NET -- list_approved_tokens

      - name: Create group, join, lock
        run: |
          set -euo pipefail
          GID="t${GITHUB_RUN_ID}"
          echo "GID=$GID" >> "$GITHUB_ENV"
          ADMIN=$(stellar keys address admin)
          # contribution 0.1, collateral 0.3 (covers a first-slot default for 3 members), 20% max bid, 10-min rounds
          stellar contract invoke --id "$CID" --source-account admin --network $NET \
            -- create_group --id "$GID" --admins "[\"$ADMIN\"]" --admin_threshold 1 \
            --token "$TOKEN" --contribution 1000000 --collateral 3000000 \
            --max_bid_bps 2000 --max_members 5 --round_duration_secs 600
          for m in m1 m2 m3; do
            stellar contract invoke --id "$CID" --source-account $m --network $NET \
              -- join_group --id "$GID" --member "$(stellar keys address $m)"
          done
          stellar contract invoke --id "$CID" --source-account admin --network $NET \
            -- lock_group --id "$GID" --admins "[\"$ADMIN\"]"

      - name: Play three rounds (everyone contributes, bids 0, round settles)
        run: |
          set -euo pipefail
          bal() { stellar contract invoke --id "$TOKEN" --source-account admin --network $NET -- balance --id "$1"; }
          for r in 1 2 3; do
            echo "── Round $r ──"
            for m in m1 m2 m3; do
              stellar contract invoke --id "$CID" --source-account $m --network $NET \
                -- contribute --id "$GID" --member "$(stellar keys address $m)"
            done
            for m in m1 m2 m3; do
              stellar contract invoke --id "$CID" --source-account $m --network $NET \
                -- submit_bid --id "$GID" --member "$(stellar keys address $m)" --bid_bps 0 \
                || echo "  ($m already won this rotation - cannot bid, expected)"
            done
            stellar contract invoke --id "$CID" --source-account m1 --network $NET -- settle_round --id "$GID"
            echo "Contract token balance after round $r: $(bal "$CID")"
            for m in m1 m2 m3; do echo "  $m balance: $(bal "$(stellar keys address $m)")"; done
          done

      - name: End of cycle - can members get their collateral back?
        run: |
          bal() { stellar contract invoke --id "$TOKEN" --source-account admin --network $NET -- balance --id "$1"; }
          CLAIMED=0
          for m in m1 m2 m3; do
            if stellar contract invoke --id "$CID" --source-account $m --network $NET \
                 -- claim_refund --id "$GID" --member "$(stellar keys address $m)"; then CLAIMED=$((CLAIMED+1)); fi
          done
          LEFT=$(bal "$CID")
          {
            echo "### Live test cycle on \`$CID\`"
            echo ""
            echo "- Group: \`$GID\`, token: \`$TOKEN\`"
            echo "- Refunds claimed: **$CLAIMED of 3**"
            echo "- Token still held by the contract: **$LEFT** (base units; 3 members x 3000000 collateral = 9000000 if none returned)"
            if [ "$CLAIMED" -eq 0 ]; then
              echo "- Result: the deployed contract did not complete the refund test. Stop and investigate before using it."
            else
              echo "- Result: refund path passed for the deployed contract."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY" | tail -8
