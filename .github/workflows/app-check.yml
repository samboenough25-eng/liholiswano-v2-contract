name: Application checks

on:
  push:
    paths:
      - "backend/**"
      - "index.html"
      - "customer.html"
      - "owner.html"
      - "platform.html"
      - "compliance.html"
      - ".github/workflows/app-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "index.html"
      - "customer.html"
      - "owner.html"
      - "platform.html"
      - "compliance.html"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Check backend JavaScript
        run: |
          node --check backend/src/server.js
          node --check backend/src/migrate.js
          node --check backend/src/reconcile.js
      - name: Check inline JavaScript in every portal
        run: |
          python - <<'PY'
          import re, subprocess, pathlib, tempfile
          files = ["index.html","platform.html","customer.html","owner.html","compliance.html"]
          for name in files:
              s = pathlib.Path(name).read_text(encoding="utf-8")
              blocks = re.findall(r'<script(?:\s+type="module")?\s*>(.*?)</script>', s, re.S | re.I)
              for i, block in enumerate(blocks):
                  if not block.strip():
                      continue
                  tag = re.search(r'<script\s+type="module"\s*>', s, re.I)
                  suffix = "mjs" if tag else "js"
                  p = pathlib.Path(tempfile.gettempdir()) / f"{name}.{i}.{suffix}"
                  p.write_text(block, encoding="utf-8")
                  subprocess.run(["node","--check",str(p)], check=True)
          PY
