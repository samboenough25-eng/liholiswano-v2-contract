<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Liholiswano Customer</title><style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#14201b}header{background:#063d2d;color:white;padding:20px}main{max-width:1050px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 14px;background:#087f5b;color:white;font-weight:700;cursor:pointer}.card,section{background:white;border:1px solid #dbe4df;border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.hidden{display:none}pre{white-space:pre-wrap;overflow:auto}.muted{color:#66736d}input,select{padding:12px;border:1px solid #ccd8d2;border-radius:9px;width:100%;box-sizing:border-box;margin:6px 0}</style></head><body><header><main style="padding:0"><b>Liholiswano Customer Portal</b><div class="nav"><button onclick="show('home')">Dashboard</button><button onclick="show('groups')">My Savings Groups</button><button onclick="show('wallet')">My Wallet</button><button onclick="show('kyc')">My KYC</button><button onclick="show('tx')">My Transactions</button><button onclick="show('notifications')">Notifications</button><button onclick="logout()">Sign out</button></div></main></header><main><section id="home"><h2>My Dashboard</h2><div class="grid"><div class="card"><b id="name">—</b><div class="muted">Name</div></div><div class="card"><b id="country">—</b><div class="muted">Country</div></div><div class="card"><b id="kycs">—</b><div class="muted">KYC status</div></div><div class="card"><b>Customer</b><div class="muted">Access level</div></div></div></section><section id="groups" class="hidden"><h2>My Savings Groups</h2><pre id="groupsout">Loading...</pre></section><section id="wallet" class="hidden"><h2>My Wallet</h2><p class="muted">Only your public Stellar address is stored. Never enter a secret key here.</p><input id="pk" placeholder="G... public Stellar address"><select id="net"><option value="testnet">Testnet</option><option value="mainnet">Mainnet</option></select><button onclick="wallet()">Link wallet</button><p id="wm"></p></section><section id="kyc" class="hidden"><h2>My KYC</h2><button onclick="kyc()">Start verification</button><pre id="ko"></pre></section><section id="tx" class="hidden"><h2>My Transactions</h2><pre id="txout">Loading...</pre></section><section id="notifications" class="hidden"><h2>My Notifications</h2><pre id="no">Loading...</pre></section></main><script>const API=window.LIHOLISWANO_API_URL||'https://liholiswano-api.onrender.com',token=localStorage.getItem('liholiswano_token');if(!token)location.href='platform.html';async function api(p,o={}){o.headers={'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})};let r=await fetch(API+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function show(id){['home','groups','wallet','kyc','tx','notifications'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='groups')load('/groups','groupsout');if(id==='tx')load('/transactions','txout');if(id==='notifications')load('/notifications','no')}async function load(p,id){try{document.getElementById(id).textContent=JSON.stringify(await api(p),null,2)}catch(e){document.getElementById(id).textContent=e.message}}async function me(){try{let u=await api('/me');if(u.role!=='customer'){location.href=u.role==='compliance'?'compliance.html':'owner.html';return}name.textContent=u.full_name;country.textContent=u.country==='BW'?'Botswana':'Eswatini';kycs.textContent=u.kyc_status}catch{logout()}}async function wallet(){try{let j=await api('/wallets',{method:'POST',body:JSON.stringify({network:net.value,publicKey:pk.value.trim()})});wm.textContent='Wallet linked: '+j.public_key}catch(e){wm.textContent=e.message}}async function kyc(){try{ko.textContent=JSON.stringify(await api('/kyc/session',{method:'POST'}),null,2)}catch(e){ko.textContent=e.message}}function logout(){localStorage.removeItem('liholiswano_token');location.href='platform.html'}me();</script></body></html>
