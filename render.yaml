services:
  - type: web
    name: liholiswano-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: ""
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: liholiswano-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://liholiswano-web.onrender.com,https://samboenough25-eng.github.io
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_CONTRACT_ID
        value: CBSBXWQFE3SOT3BOPVZ2IHK32PBUP5BFRHJLI6R2WH6WIQJQLV4WAYHO
      - key: KYC_PROVIDER
        value: stub
      - key: PAYMENT_PROVIDER
        value: stellar
      - key: RECONCILE_SECRET
        generateValue: true

  - type: cron
    name: liholiswano-reconciliation
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node -e "fetch('https://liholiswano-api.onrender.com/internal/reconcile',{method:'POST',headers:{'x-reconcile-secret':process.env.RECONCILE_SECRET}}).then(async r=>{console.log(await r.text());if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
    schedule: "*/15 * * * *"
    envVars:
      - key: RECONCILE_SECRET
        fromService:
          name: liholiswano-api
          type: web
          envVarKey: RECONCILE_SECRET

databases:
  - name: liholiswano-db
    plan: free
    region: frankfurt
    databaseName: liholiswano
    postgresMajorVersion: "17"
