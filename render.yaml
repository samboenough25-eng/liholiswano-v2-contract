services:
  - type: web
    name: liholiswano-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: ""
    buildCommand: npm install && npm --prefix backend install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: liholiswano-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://liholiswano-web.onrender.com,https://samboenough25-eng.github.io
      - key: STELLAR_NETWORK
        value: testnet
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_CONTRACT_ID
        value: CBSBXWQFE3SOT3BOPVZ2IHK32PBUP5BFRHJLI6R2WH6WIQJQLV4WAYHO
      - key: KYC_PROVIDER
        value: stub
      - key: PAYMENT_PROVIDER
        value: stellar
      - key: RECONCILE_SECRET
        generateValue: true

  - type: web
    runtime: static
    name: liholiswano-web
    buildCommand: echo 'Static Liholiswano web app'
    staticPublishPath: web
    renderSubdomainPolicy: enabled
    routes:
      - type: header
        path: /*
        name: X-Content-Type-Options
        value: nosniff
      - type: header
        path: /*
        name: X-Frame-Options
        value: DENY
      - type: header
        path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: liholiswano-db
    plan: free
    region: frankfurt
    databaseName: liholiswano
    postgresMajorVersion: "17"
