<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Liholiswano Compliance</title><style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#14201b}header{background:#063d2d;color:white;padding:18px}main{max-width:1100px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 14px;background:#087f5b;color:white;font-weight:700;cursor:pointer}.card{background:white;border:1px solid #dbe4df;border-radius:14px;padding:16px;margin:10px 0}.muted{color:#66736d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}</style></head><body><header><main style="padding:0"><b>Liholiswano Compliance Portal</b><div class="nav"><button onclick="load()">Refresh KYC queue</button><button onclick="logout()">Sign out</button></div></main></header><main><p class="muted">Review provider results and apply a documented KYC status. This screen does not display raw identity documents or biometric data.</p><div id="out">Loading...</div></main><script>
const API=(window.LIHOLISWANO_API_URL||'https://liholiswano-api.onrender.com')+'/api',token=localStorage.getItem('liholiswano_token');
if(!token)location.href='platform.html';
async function api(p,o={}){o.headers={'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})};const r=await fetch(API+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const me=await api('/me');if(!['compliance','owner'].includes(me.role))return location.href='customer.html';const rows=await api('/admin/kyc');const out=document.getElementById('out');out.innerHTML='';rows.forEach(u=>{const card=document.createElement('div');card.className='card';card.innerHTML='<b>'+esc(u.full_name)+'</b><div>'+esc(u.email)+'</div><div>'+esc(u.country)+' · <b>'+esc(u.kyc_status)+'</b></div><div>'+esc(u.kyc_reference||'No reference')+'</div>';const note=document.createElement('input');note.placeholder='Review note (required for Verify/Reject)';note.style.cssText='width:100%;box-sizing:border-box;padding:9px;margin:8px 0;border:1px solid #ccd8d2;border-radius:8px';card.appendChild(note);[['verified','Verify'],['pending','Review'],['rejected','Reject']].forEach(([status,label])=>{const b=document.createElement('button');b.textContent=label;b.style.marginRight='6px';b.onclick=()=>setStatus(u.id,status,note.value);card.appendChild(b)});out.appendChild(card)})}catch(e){document.getElementById('out').textContent=e.message}}
async function setStatus(id,status,note=''){try{await api('/admin/users/'+id+'/kyc',{method:'PATCH',body:JSON.stringify({status,note})});await load()}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function logout(){localStorage.removeItem('liholiswano_token');location.href='platform.html'}
load();
</script></body></html>
