<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Liholiswano Login</title><style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#14201b}main{max-width:760px;margin:50px auto;padding:20px}.box{background:white;padding:25px;border-radius:16px;border:1px solid #dbe4df}input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ccd8d2}button{background:#087f5b;color:white;border:0;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.muted{color:#66736d}</style></head><body><main><div class="box"><h1>Liholiswano</h1><p class="muted">Financial Services Platform • Eswatini & Botswana</p><div class="grid"><div><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Sign in</button></div><div><h2>Create customer account</h2><input id="name" placeholder="Full name"><input id="re" type="email" placeholder="Email"><select id="country"><option value="BW">Botswana</option><option value="SZ">Eswatini</option></select><input id="rp" type="password" placeholder="Password (12+ characters)"><button onclick="register()">Create account</button></div></div><p id="msg" class="muted"></p></div></main><script>const API=window.LIHOLISWANO_API_URL||'/api';async function api(p,o={}){o.headers={'Content-Type':'application/json',...(o.headers||{})};let r=await fetch(API+p,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function go(j){localStorage.setItem('liholiswano_token',j.token);location.href=j.portal==='owner'?'owner.html':j.portal==='compliance'?'compliance.html':'customer.html'}async function login(){try{go(await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})}))}catch(e){msg.textContent=e.message}}async function register(){try{go(await api('/auth/register',{method:'POST',body:JSON.stringify({fullName:name.value,email:re.value,password:rp.value,country:country.value})}))}catch(e){msg.textContent=e.message}}</script></body></html>
