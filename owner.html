<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Liholiswano Owner</title><style>body{font-family:system-ui;margin:0;background:#f4f7f6;color:#14201b}header{background:#063d2d;color:white;padding:20px}main{max-width:1150px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 14px;background:#087f5b;color:white;font-weight:700;cursor:pointer}.card,section{background:white;border:1px solid #dbe4df;border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hidden{display:none}pre{white-space:pre-wrap;overflow:auto}.muted{color:#66736d}</style></head><body><header><main style="padding:0"><b>Liholiswano Owner Portal</b><div style="color:#c9ddd6">Restricted business administration</div><div class="nav"><button onclick="show('home')">Overview</button><button onclick="show('customers')">Customers</button><button onclick="show('groups')">Savings Groups</button><button onclick="show('tx')">Transactions</button><button onclick="show('kyc')">KYC</button><button onclick="show('audit')">Audit Log</button><button onclick="logout()">Sign out</button></div></main></header><main><section id="home"><h2>Owner Overview</h2><div class="grid"><div class="card"><b id="customerCount">—</b><div class="muted">Customers</div></div><div class="card"><b id="pending">—</b><div class="muted">Pending KYC</div></div><div class="card"><b id="groupsn">—</b><div class="muted">Savings groups</div></div><div class="card"><b id="txn">—</b><div class="muted">Transactions</div></div><div class="card"><b id="volume">—</b><div class="muted">Confirmed volume</div></div></div></section><section id="customers" class="hidden"><h2>Customers</h2><button onclick="load('/admin/users','customersout')">Refresh</button><pre id="customersout"></pre></section><section id="groups" class="hidden"><h2>Savings Groups</h2><p class="muted">Soroban contract settlement remains separate from the application layer.</p></section><section id="tx" class="hidden"><h2>All Transactions</h2><pre id="txout"></pre></section><section id="kyc" class="hidden"><h2>KYC / Compliance</h2><pre id="kycout"></pre></section><section id="audit" class="hidden"><h2>Audit Log</h2><pre id="auditout"></pre></section></main><script>const API=window.LIHOLISWANO_API_URL||'https://liholiswano-api.onrender.com',token=localStorage.getItem('liholiswano_token');if(!token)location.href='platform.html';async function api(p){let r=await fetch(API+p,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function me(){try{let u=await api('/me');if(!['owner','admin'].includes(u.role)){location.href=u.role==='compliance'?'compliance.html':'customer.html';return}let s=await api('/admin/stats');customerCount.textContent=s.customers;pending.textContent=s.pending_kyc;groupsn.textContent=s.groups;txn.textContent=s.transactions;volume.textContent=s.confirmed_volume}catch{logout()}}function show(id){['home','customers','groups','tx','kyc','audit'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='customers')load('/admin/users','customersout');if(id==='tx')load('/admin/transactions','txout');if(id==='kyc')load('/admin/kyc','kycout');if(id==='audit')load('/admin/audit','auditout')}async function load(p,id){try{document.getElementById(id).textContent=JSON.stringify(await api(p),null,2)}catch(e){document.getElementById(id).textContent=e.message}}function logout(){localStorage.removeItem('liholiswano_token');location.href='platform.html'}me();</script></body></html>
